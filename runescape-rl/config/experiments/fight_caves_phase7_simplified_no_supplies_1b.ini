[base]
env_name = fight_caves
checkpoint_interval = 50

# Phase 7 simplified no-supplies retrain.
# Benchmark target: previous current-repo no-supplies 1B run `2386cesn`.
# Same hparams/loadout as that benchmark, but removes consumable waste,
# wrong-prayer, melee-pressure, wasted-attack, kiting, safespot, and resource
# threat-window shaping. The Puffer policy exposes only move/attack/prayer.

[env]
initial_sharks = 0
initial_prayer_doses = 0
w_damage_dealt = 0.9
w_damage_taken = -1.9
w_npc_kill = 3.5
w_wave_clear = 15.0
w_jad_kill = 2000.0
w_player_death = -11.0
w_correct_jad_prayer = 1.5
w_correct_danger_prayer = 0.25
w_invalid_action = -0.1
w_tick_penalty = -0.005
shape_unnecessary_prayer_penalty = 0.0
shape_wave_stall_start = 0
shape_wave_stall_ramp_interval = 0
shape_wave_stall_base_penalty = 0.0
shape_wave_stall_cap = 0.0
shape_jad_heal_penalty = -0.3
obs_ablate_npc_distance = 0
obs_ablate_incoming_aggregates = 1
obs_ablate_npc_valid = 0

[vec]
total_agents = 4096
num_buffers = 2

[train]
total_timesteps = 1_000_000_000
anneal_lr = 0
learning_rate = 0.0009000000000000007
ent_coef = 0.02423374579539897
gamma = 0.9963272487242703
gae_lambda = 0.96405274026941
clip_coef = 0.17830599245832296
vf_coef = 1
vf_clip_coef = 0.15124043205980495
max_grad_norm = 0.25
horizon = 256
minibatch_size = 4096
replay_ratio = 1.567733336432473
vtrace_rho_clip = 0.5
vtrace_c_clip = 0.5037274754757021
prio_alpha = 0.9682355928752012
prio_beta0 = 0
beta1 = 0.95
beta2 = 0.9995810484472892
eps = 1e-10

[policy]
hidden_size = 256
num_layers = 3

[run]
manifest_path = ''
manifest_schema_version = 1
observation_version = 'fight_caves_puffer_policy_obs_v2_mask_heads_0_2_no_supplies'
action_version = 'fight_caves_multidiscrete_3_head_no_supplies_v1'
reward_version = 'fight_caves_v38_phase7_simplified_no_supplies'
reward_clip_enabled = 1
reward_clip_min = -1.0
reward_clip_max = 1.0

[sweep]
metric = jad_kill_rate
