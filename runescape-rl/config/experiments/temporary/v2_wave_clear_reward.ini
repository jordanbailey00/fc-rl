[base]
env_name = fight_caves
checkpoint_interval = 50
eval_episodes = 10000
cudagraphs = 10
reset_state = True
seed = 73

# Sparse-reward experiment derived from v2_simple_reward.ini. The only scalar
# rewards are increasing wave clears and cave completion. Across a complete
# cave, the 63 wave-clear events have approximately +1 total configured weight.
[env]
initial_sharks = 0
initial_prayer_doses = 0
w_damage_dealt = 0.0
w_progress = 0.0
negative_progress_multiplier = 1.1
w_damage_taken = 0.0
w_npc_kill = 0.0
w_wave_clear = 0.000496277916
w_jad_kill = 0.0
w_cave_complete = 1.0
w_player_death = 0.0
scale_player_death_with_progress = 0
player_death_min_scale = 0.0
w_correct_jad_prayer = 0.0
w_correct_danger_prayer = 0.0
w_prayer_lost = 0.0
w_invalid_action = 0.0
w_tick_penalty = 0.0
shape_unnecessary_prayer_penalty = 0.0
shape_wave_stall_start = 0
shape_wave_stall_ramp_interval = 0
shape_wave_stall_base_penalty = 0.0
shape_wave_stall_cap = 0.0
shape_jad_heal_penalty = 0.0
shape_npc_heal_penalty = 0.0
shape_no_progress_start_1 = 0
shape_no_progress_start_2 = 0
shape_no_progress_start_3 = 0
shape_no_progress_penalty_1 = 0.0
shape_no_progress_penalty_2 = 0.0
shape_no_progress_penalty_3 = 0.0
shape_no_attack_start = 0
shape_no_attack_base_penalty = 0.0
shape_no_attack_wave_scale = 0.0
obs_ablate_npc_distance = 0
obs_ablate_incoming_aggregates = 1
obs_ablate_npc_valid = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 2_500_000_000
anneal_lr = 0
learning_rate = 0.0009393225766890022
ent_coef = 0.00644463919247784
gamma = 0.9995188470393721
gae_lambda = 0.9995
horizon = 256
minibatch_size = 4096
replay_ratio = 1.333589848960783
clip_coef = 0.13236033890397741
vf_coef = 1
vf_clip_coef = 0.15124043205980495
max_grad_norm = 0.25
vtrace_rho_clip = 0.5
vtrace_c_clip = 0.5037274754757021
prio_alpha = 0.9682355928752012
prio_beta0 = 0
beta1 = 0.95
beta2 = 0.9995810484472892
eps = 1e-10

[policy]
hidden_size = 256
num_layers = 3
expansion_factor = 1

[run]
manifest_path = ''
manifest_schema_version = 1
observation_version = 'fight_caves_puffer_policy_obs_v7_npc_prayer_drain_healing_aggro_kill_events_mask_heads_0_2_no_supplies'
action_version = 'fight_caves_multidiscrete_3_head_no_supplies_v1'
reward_version = 'fight_caves_v2_wave_clear_plus_cave_complete'
reward_clip_enabled = 1
reward_clip_min = -1.0
reward_clip_max = 1.0

[sweep]
metric = cave_progress
