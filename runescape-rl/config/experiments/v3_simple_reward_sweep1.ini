[base]
env_name = fight_caves
checkpoint_interval = 50
eval_episodes = 10000
cudagraphs = 10
reset_state = True

# Keep one native trainer seed throughout the adaptive search so Protein can
# attribute outcome changes to hyperparameters. Validate finalists later with
# independent seeds.
seed = 73

# Stage 1 starts from the exact 8rg9wurg v3 simple-reward baseline. Keep the
# environment, rewards, observations, action masks, loadout, architecture,
# vectorization, and 750M-step budget fixed across all trials.
[env]
initial_sharks = 0
initial_prayer_doses = 0
w_damage_dealt = 0.0
w_progress = 0.001
w_damage_taken = -0.25
w_npc_kill = 0.0
w_wave_clear = 0.0
w_jad_kill = 0.0
w_cave_complete = 1.0
w_player_death = -1.0
w_correct_jad_prayer = 0.0
w_correct_danger_prayer = 0.005
w_prayer_lost = -0.02
w_invalid_action = -0.1
w_tick_penalty = -0.0001
shape_unnecessary_prayer_penalty = 0.0
shape_wave_stall_start = 0
shape_wave_stall_ramp_interval = 0
shape_wave_stall_base_penalty = 0.0
shape_wave_stall_cap = 0.0
shape_jad_heal_penalty = 0.0
shape_npc_heal_penalty = -0.005
shape_no_progress_start_1 = 800
shape_no_progress_start_2 = 1600
shape_no_progress_start_3 = 2400
shape_no_progress_penalty_1 = -0.001
shape_no_progress_penalty_2 = -0.005
shape_no_progress_penalty_3 = -0.02
shape_no_attack_start = 50
shape_no_attack_base_penalty = -0.005
shape_no_attack_wave_scale = 0.05
obs_ablate_npc_distance = 0
obs_ablate_incoming_aggregates = 1
obs_ablate_npc_valid = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 750_000_000
anneal_lr = 0
learning_rate = 0.0009393225766890022
ent_coef = 0.00644463919247784
gamma = 0.9995188470393721
gae_lambda = 0.9995
horizon = 256
minibatch_size = 4096
replay_ratio = 1.333589848960783
clip_coef = 0.13236033890397741
vf_coef = 1
vf_clip_coef = 0.15124043205980495
max_grad_norm = 0.25
vtrace_rho_clip = 0.5
vtrace_c_clip = 0.5037274754757021
prio_alpha = 0.9682355928752012
prio_beta0 = 0
beta1 = 0.95
beta2 = 0.9995810484472892
eps = 1e-10

[policy]
hidden_size = 256
num_layers = 3
expansion_factor = 1

[run]
manifest_path = ''
manifest_schema_version = 2
observation_version = 'fight_caves_puffer_policy_obs_v8_prayer_timing_mask8_no_supplies'
action_version = 'fight_caves_multidiscrete_3_head_no_supplies_v3_prayer8_stationary_attack_tick'
reward_version = 'fight_caves_v4_progress_npc_heal_penalty_m0005_prayer_snapshot_flick_drain'
reward_clip_enabled = 1
reward_clip_min = -1.0
reward_clip_max = 1.0

[sweep]
method = Protein
metric = jad_kill_rate
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 140
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.1
sweep_only = train/learning_rate, train/ent_coef, train/gamma, train/gae_lambda, train/horizon, train/minibatch_size, train/replay_ratio, train/clip_coef, train/prio_alpha, train/prio_beta0, train/vtrace_rho_clip, train/vtrace_c_clip

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00015
max = 0.004
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.04
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.995
max = 0.99995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.9999
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 128
max = 1024
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.35
max = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.35
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 0.8
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 2.0
scale = auto
