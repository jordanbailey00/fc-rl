[base]
env_name = fight_caves
checkpoint_interval = 50
eval_episodes = 10000
cudagraphs = 10
reset_state = True

# Launch from runescape-rl with:
# ./train.sh sweep \
#   --config config/experiments/fight_caves_v45_value_arch_batch_sweep_750m.ini \
#   --tag v4.5_value_arch_batch_sweep_750m_130_corrected \
#   --wandb-group v45_value_arch_batch_sweep_750m_130_corrected

# Keep one native trainer seed throughout the adaptive search so Protein can
# attribute outcome changes to hyperparameters. Validate finalists later with
# independent seeds 101 and 202.
seed = 73

# Combined value/optimizer and architecture/batch sweep centered on W&B run
# 88l9p7ie (v4.5_correct_movement). Keep the environment, rewards,
# observations, action contract, loadout, Stage 1 trainer values, and fixed
# 750M-step budget unchanged across all 130 trials.
[env]
initial_sharks = 0
initial_prayer_doses = 0
w_damage_dealt = 0.0
w_progress = 0.001
w_damage_taken = -0.25
w_npc_kill = 0.0
w_wave_clear = 0.0
w_jad_kill = 0.0
w_cave_complete = 1.0
w_player_death = -1.0
w_correct_jad_prayer = 0.0
w_correct_danger_prayer = 0.005
w_prayer_lost = -0.02
w_invalid_action = -0.1
w_tick_penalty = -0.0001
shape_unnecessary_prayer_penalty = 0.0
shape_wave_stall_start = 0
shape_wave_stall_ramp_interval = 0
shape_wave_stall_base_penalty = 0.0
shape_wave_stall_cap = 0.0
shape_jad_heal_penalty = 0.0
shape_npc_heal_penalty = -0.005
shape_no_progress_start_1 = 800
shape_no_progress_start_2 = 1600
shape_no_progress_start_3 = 2400
shape_no_progress_penalty_1 = -0.001
shape_no_progress_penalty_2 = -0.005
shape_no_progress_penalty_3 = -0.02
shape_no_attack_start = 50
shape_no_attack_base_penalty = -0.005
shape_no_attack_wave_scale = 0.05
obs_ablate_npc_distance = 0
obs_ablate_incoming_aggregates = 1
obs_ablate_npc_valid = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 750_000_000
anneal_lr = 0
learning_rate = 0.00207567504650331
ent_coef = 0.000625460620549345
gamma = 0.9991261141073255
gae_lambda = 0.9
horizon = 256
minibatch_size = 32768
replay_ratio = 2.055184291514704
clip_coef = 0.05
vf_coef = 1
vf_clip_coef = 0.15124043205980495
max_grad_norm = 0.25
vtrace_rho_clip = 2.0
vtrace_c_clip = 0.9746667741536915
prio_alpha = 0.9110743956381228
prio_beta0 = 0.2258134371255269
beta1 = 0.95
beta2 = 0.9995810484472892
eps = 1e-10

[policy]
hidden_size = 256
num_layers = 3
expansion_factor = 1

[run]
manifest_path = ''
manifest_schema_version = 2
observation_version = 'fight_caves_puffer_policy_obs_v8_prayer_timing_mask8_no_supplies'
action_version = 'fight_caves_multidiscrete_3_head_no_supplies_v3_prayer8_stationary_attack_tick'
reward_version = 'fight_caves_v4_progress_npc_heal_penalty_m0005_prayer_snapshot_flick_drain'
reward_clip_enabled = 1
reward_clip_min = -1.0
reward_clip_max = 1.0

[sweep]
method = Protein
metric = jad_kill_rate
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 130
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.1
sweep_only = train/vf_coef, train/vf_clip_coef, train/max_grad_norm, train/beta1, policy/hidden_size, policy/num_layers, vec/total_agents

[sweep.train.vf_coef]
distribution = uniform
min = 0.4
max = 2.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 0.4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.85
max = 0.99
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto
