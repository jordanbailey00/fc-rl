[base]
env_name = fight_caves
checkpoint_interval = 50
eval_episodes = 10000
cudagraphs = 10
reset_state = True

# Keep one native trainer seed throughout the adaptive search so Protein compares
# hyperparameters against the same deterministic training stream. Confirm the
# finalists later with independent seeds 101 and 202.
seed = 73

# Overnight optimizer sweep based on commit 6a5046a65. The environment, rewards,
# v6 observation contract, action space, loadout, policy architecture, horizon,
# and minibatch are fixed. W&B run ocunodgx is the pre-sweep reference for this
# backend/observation contract; the trainer center is the promoted b5m07qqr v1.0
# recipe.
[env]
initial_sharks = 0
initial_prayer_doses = 0
w_damage_dealt = 0.0
w_progress = 0.001
w_damage_taken = -0.25
w_npc_kill = 0.0
w_wave_clear = 0.0
w_jad_kill = 0.0
w_cave_complete = 1.0
w_player_death = -1.0
w_correct_jad_prayer = 0.0
w_correct_danger_prayer = 0.005
w_prayer_lost = -0.02
w_invalid_action = -0.1
w_tick_penalty = -0.0001
shape_unnecessary_prayer_penalty = 0.0
shape_wave_stall_start = 0
shape_wave_stall_ramp_interval = 0
shape_wave_stall_base_penalty = 0.0
shape_wave_stall_cap = 0.0
shape_jad_heal_penalty = 0.0
shape_npc_heal_penalty = 0.0
shape_no_progress_start_1 = 800
shape_no_progress_start_2 = 1600
shape_no_progress_start_3 = 2400
shape_no_progress_penalty_1 = -0.001
shape_no_progress_penalty_2 = -0.005
shape_no_progress_penalty_3 = -0.02
shape_no_attack_start = 50
shape_no_attack_base_penalty = -0.005
shape_no_attack_wave_scale = 0.05
obs_ablate_npc_distance = 0
obs_ablate_incoming_aggregates = 1
obs_ablate_npc_valid = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[train]
gpus = 1
total_timesteps = 750_000_000
anneal_lr = 0
learning_rate = 0.0012501122189793278
ent_coef = 0.01261936845511762
gamma = 0.9977806603387215
gae_lambda = 0.9944084418817187
horizon = 256
minibatch_size = 4096
replay_ratio = 1.1570637170225382
clip_coef = 0.17830599245832296
vf_coef = 1
vf_clip_coef = 0.15124043205980495
max_grad_norm = 0.25
vtrace_rho_clip = 0.5
vtrace_c_clip = 0.5037274754757021
prio_alpha = 0.9682355928752012
prio_beta0 = 0
beta1 = 0.95
beta2 = 0.9995810484472892
eps = 1e-10

[policy]
hidden_size = 256
num_layers = 3
expansion_factor = 1

[run]
manifest_path = ''
manifest_schema_version = 1
observation_version = 'fight_caves_puffer_policy_obs_v6_npc_prayer_drain_healing_aggro_mask_heads_0_2_no_supplies'
action_version = 'fight_caves_multidiscrete_3_head_no_supplies_v1'
reward_version = 'fight_caves_v38_fc_revamp_step2_raw_work_progress_prayer_conserve_no_attack'
reward_clip_enabled = 1
reward_clip_min = -1.0
reward_clip_max = 1.0

[sweep]
method = Protein
metric = cave_progress
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1500
max_runs = 96
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = train/learning_rate, train/ent_coef, train/gamma, train/gae_lambda, train/replay_ratio, train/clip_coef

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0006
max = 0.0018
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.004
max = 0.024
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.9997
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.99
max = 0.9995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 1.7
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.10
max = 0.28
scale = auto
