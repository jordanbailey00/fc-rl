  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #546777" transform="translate(38.88 454.882837)">Sources: August top-eight report and native final metrics. q10 is a training quantile, not an evaluation confidence interval.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #546777" transform="translate(38.88 467.932837)">The later learner improved near the end; low quarter-wide statistics alone do not establish an end-of-run collapse.</text>
  </g>
